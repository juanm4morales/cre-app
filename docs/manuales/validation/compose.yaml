services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?run.sh must generate test secret}
      POSTGRES_DB: postgres
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?run.sh must generate test secret}
    volumes:
      - dbdata:/var/lib/postgresql/data
    networks:
      - db_internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 2s
      timeout: 2s
      retries: 30

  api:
    build:
      context: ${WORKTREE:?run.sh must provide temporary source copy}
      dockerfile: Dockerfile.selfhost-validation
    user: "10001:10001"
    environment:
      DEBUG: "False"
      SECRET_KEY: ${DJANGO_SECRET_KEY:?run.sh must generate test secret}
      ALLOWED_HOSTS: creapp.test,localhost,127.0.0.1
      CSRF_TRUSTED_ORIGINS: https://creapp.test:${HTTPS_PORT:?run.sh must select local test port}
      CORS_ALLOWED_ORIGINS: https://creapp.test:${HTTPS_PORT:?run.sh must select local test port}
      CSRF_COOKIE_SECURE: "True"
      SESSION_COOKIE_SECURE: "True"
      CSRF_COOKIE_SAMESITE: Lax
      SESSION_COOKIE_SAMESITE: Lax
      SECURE_SSL_REDIRECT: "True"
      SECURE_HSTS_SECONDS: "0"
      POSTGRES_DB: creapp_db
      POSTGRES_USER: creapp_usr
      POSTGRES_PASSWORD: ${APP_DB_PASSWORD:?run.sh must generate test secret}
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      DJANGO_SUPERUSER_USERNAME: creapp-smoke-admin
      DJANGO_SUPERUSER_EMAIL: smoke@example.invalid
      DJANGO_SUPERUSER_PASSWORD: ${DJANGO_SUPERUSER_PASSWORD:?run.sh must generate test secret}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - staticfiles:/app/backend/staticfiles
    expose:
      - "8000"
    networks:
      - db_internal
      - frontend

  nginx:
    image: nginxinc/nginx-unprivileged:stable-alpine
    user: "101:101"
    depends_on:
      - api
    ports:
      - "127.0.0.1:${HTTPS_PORT:?run.sh must select local test port}:8443"
    volumes:
      - ${HARNESS_DIR:?run.sh must set harness directory}/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ${CERT_DIR:?run.sh must generate test certs}:/etc/nginx/certs:ro
      - ${WORKTREE:?run.sh must provide temporary source copy}/frontend/dist:/srv/creapp/frontend/dist:ro
      - staticfiles:/srv/creapp/staticfiles:ro
    networks:
      - frontend

networks:
  # PostgreSQL is reachable only from the API service on this isolated network.
  db_internal:
    internal: true
  # Only the TLS test proxy is published to loopback from this network.
  frontend:
    driver: bridge

volumes:
  dbdata:
  staticfiles:
