<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>CREApp</title>
    <script>
      (function () {
        var theme = (function () {
          try { var s = localStorage.getItem('cre_theme'); if (s === 'dark' || s === 'light') return s; } catch (e) {}
          return 'light';
        })();
        document.documentElement.classList.add(theme);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
